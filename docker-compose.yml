services:
  proxy-monitor:
    build: .
    container_name: proxy-monitor
    ports:
      - "8069:8069"
    environment:
      # Everything below is optional and has a sane default. Leave API_KEY unset
      # and one is generated on first boot, then printed once in the log.
      - INTERVAL_SECONDS=${INTERVAL_SECONDS:-1200}
      - MAX_LATENCY_SECONDS=${MAX_LATENCY_SECONDS:-5.0}
      - VALIDATOR_WORKERS=${VALIDATOR_WORKERS:-100}
      - PUBLIC_DASHBOARD=${PUBLIC_DASHBOARD:-true}
    volumes:
      # Holds the proxy cache, the settings overrides, the password hash and the
      # session signing key. Without it every restart starts from scratch.
      - proxy-monitor-data:/data
    restart: unless-stopped
    # Docker's json-file driver keeps everything by default. With a discovery
    # cycle every 20 minutes and a re-check every 2, that is a log that grows
    # on the host's disk until someone notices.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  proxy-monitor-data:
